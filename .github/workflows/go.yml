name: Build and Test Go

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:

  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v2

    - name: Set up Go
      uses: actions/setup-go@v2
      with:
        go-version: 1.27

    - name: Build
      run: go build -v ./...

    - name: Go Tests
      run: go test -v ./...

    - name: CLI Tests
      run: ./cli-test-suite.sh

    - uses: actions/upload-artifact@v4
      with:
        name: built-assets
        path: checkssl
