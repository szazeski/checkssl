version: 2
before:
  hooks:
    - go mod tidy

builds:
  - env:
      - CGO_ENABLED=0
    goos:
      - linux
      - windows
      - darwin
    goarch:
      - 386
      - amd64
      - arm64

checksum:
  name_template: 'checksums.txt'

archives:
  - id: checkssl
    name_template: >-
      {{- .ProjectName }}_
      {{- title .Os }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else if eq .Arch "386" }}i386
      {{- else }}{{ .Arch }}{{ end }}
      {{- if .Arm }}v{{ .Arm }}{{ end -}}

    format_overrides:
      - goos: windows
        formats:
          - zip

brews:
  - name: checkssl

    repository:
      owner: szazeski
      name: homebrew-tap
      branch: main

    url_template: "https://github.com/szazeski/checkssl/releases/download/{{ .Tag }}/{{ .ArtifactName }}"

    commit_author:
      name: goreleaserbot
      email: goreleaser@zazeski.com

    # The project name and current git tag are used in the format string.
    commit_msg_template: "Brew formula update for {{ .ProjectName }} version {{ .Tag }}"

    # Folder inside the repository to put the formula.
    # Default is the root folder.
    directory: Formula

    homepage: "https://www.checkssl.org/"
    description: "Simple tool to check or monitor TLS/SSL certificates are working."
    license: "MIT"

    test: |
      system "#{bin}/checkssl checkssl.org"

dockers:
  - image_templates:
      - "szazeski/checkssl:{{ .Version }}-amd64"
      - "szazeski/checkssl:{{ .Tag }}-amd64"
      - "szazeski/checkssl:latest-amd64"
    dockerfile: Dockerfile.goreleaser
    use: docker
    build_flag_templates:
      - "--platform=linux/amd64"
      - "--label=org.opencontainers.image.title={{ .ProjectName }}"
      - "--label=org.opencontainers.image.revision={{ .FullCommit }}"
      - "--label=org.opencontainers.image.version={{ .Version }}"
      - "--label=org.opencontainers.image.created={{ .Date }}"
    goos: linux
    goarch: amd64

  - image_templates:
      - "szazeski/checkssl:{{ .Version }}-arm64"
      - "szazeski/checkssl:{{ .Tag }}-arm64"
      - "szazeski/checkssl:latest-arm64"
    dockerfile: Dockerfile.goreleaser
    use: docker
    build_flag_templates:
      - "--platform=linux/arm64"
      - "--label=org.opencontainers.image.title={{ .ProjectName }}"
      - "--label=org.opencontainers.image.revision={{ .FullCommit }}"
      - "--label=org.opencontainers.image.version={{ .Version }}"
      - "--label=org.opencontainers.image.created={{ .Date }}"
    goos: linux
    goarch: arm64

docker_manifests:
  - name_template: "szazeski/checkssl:{{ .Version }}"
    image_templates:
      - "szazeski/checkssl:{{ .Version }}-amd64"
      - "szazeski/checkssl:{{ .Version }}-arm64"
  - name_template: "szazeski/checkssl:{{ .Tag }}"
    image_templates:
      - "szazeski/checkssl:{{ .Tag }}-amd64"
      - "szazeski/checkssl:{{ .Tag }}-arm64"
  - name_template: "szazeski/checkssl:latest"
    image_templates:
      - "szazeski/checkssl:latest-amd64"
      - "szazeski/checkssl:latest-arm64"
